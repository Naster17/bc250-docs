version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Nextra 4.x MDX loader is incompatible with Next 16 (Turbopack
      # serializable-options error); stay on Next 15 until Nextra supports it.
      - dependency-name: next
        update-types:
          - version-update:semver-major
    groups:
      npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
